<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{{heading}}}</title>
</head>
<body style="margin:0;padding:0;background:#f4f1ea;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f1ea;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:100%;max-width:600px;background:#ffffff;border:1px solid #e8e4dc;border-radius:12px;overflow:hidden;font-family:Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#333f48;">

          <!-- School header -->
          <tr>
            <td style="background:{{{primaryColor}}};padding:14px 20px;color:#ffffff;font-size:14px;font-weight:600;">
              {{{wordmark}}}
            </td>
          </tr>

          <!-- Heading + body -->
          <tr>
            <td style="padding:24px 20px 8px;">
              <h1 style="margin:0 0 8px;font-size:22px;line-height:1.3;font-weight:700;color:#333f48;">{{{heading}}}</h1>
              <p style="margin:0;font-size:14px;line-height:1.6;color:#5f7280;">{{{body}}}</p>
            </td>
          </tr>

          <!-- Details card -->
          <tr>
            <td style="padding:16px 20px 8px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border:1px solid #e8e4dc;border-radius:10px;">
                <tr>
                  <td style="padding:14px 16px;">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                      <tr>
                        <td width="64" valign="top" style="padding:0 0 10px;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#8a96a0;">Where</td>
                        <td valign="top" style="padding:0 0 10px;font-size:14px;line-height:1.4;">
                          <div style="font-weight:600;color:#333f48;">{{{locationName}}}</div>
                          <div style="font-size:12px;color:#8a96a0;">{{{locationDetail}}}</div>
                        </td>
                      </tr>
                      <tr>
                        <td width="64" valign="top" style="padding:0;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#8a96a0;">When</td>
                        <td valign="top" style="padding:0;font-size:14px;line-height:1.4;font-weight:600;color:#333f48;">{{{whenLabel}}}</td>
                      </tr>
                    </table>
                    <!--
                      Optional note. Both lines are empty strings when there is no note.
                      An empty block has no height, so the whole row disappears; the label's
                      tall line-height supplies the gap above the note when it is present.
                    -->
                    <div style="font-size:11px;line-height:30px;letter-spacing:0.08em;text-transform:uppercase;color:#8a96a0;">{{{noteLabel}}}</div>
                    <div style="font-size:14px;line-height:1.5;color:#333f48;">{{{noteText}}}</div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Button -->
          <tr>
            <td style="padding:16px 20px 24px;">
              <a href="{{{ctaUrl}}}" style="display:inline-block;background:{{{primaryColor}}};color:#ffffff;text-decoration:none;font-size:14px;font-weight:600;padding:11px 20px;border-radius:8px;">{{{ctaLabel}}} &rarr;</a>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:16px 20px;border-top:1px solid #e8e4dc;font-size:12px;line-height:1.5;color:#8a96a0;">
              Sent by Co-Foundr on behalf of {{{wordmark}}}. Meetups happen only at university-approved campus locations.
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
